<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackupAMG</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/marca.svg">
<link rel="stylesheet" href="/estilo.css?v=pie">
</head>
<body>
<!-- Iconos Lucide (ISC), solo los que se usan. Ver docs/THIRD_PARTY_LICENSES.md -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
<symbol id="i-hard-drive" viewBox="0 0 24 24"><path d="M10 16h.01"/> <path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/> <path d="M21.946 12.013H2.054"/> <path d="M6 16h.01"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/> <path d="M12 6v6l4 2"/></symbol>
<symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/> <path d="M3 3v5h5"/> <path d="M12 7v5l4 2"/></symbol>
<symbol id="i-rotate-ccw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/> <path d="M3 3v5h5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/> <circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/> <path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/> <path d="M21 3v5h-5"/> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/> <path d="M8 16H3v5"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12"/> <path d="m17 8-5-5-5 5"/> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>
<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/> <path d="M12 19V5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/> <path d="M14 2v5a1 1 0 0 0 1 1h5"/></symbol>
</svg>
<div class="app">
<aside id="barra" class="barra-lateral" hidden>
  <div class="marca"><img class="marca-barra" src="/marca-completa.svg" alt="BackupAMG: copias, versiones, restauración" width="200" height="57"></div>
  <p id="equipo" class="equipo"></p>
  <nav id="menu" class="menu">
    <button type="button" data-pantalla="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-house"/></svg><span></span></button>
    <button type="button" data-pantalla="copiar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-folder"/></svg><span></span></button>
    <button type="button" data-pantalla="destino"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hard-drive"/></svg><span></span></button>
    <button type="button" data-pantalla="cuando"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock"/></svg><span></span></button>
    <button type="button" data-pantalla="historial"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-history"/></svg><span></span></button>
    <button type="button" data-pantalla="restaurar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-rotate-ccw"/></svg><span></span></button>
    <button type="button" data-pantalla="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg><span></span></button>
  </nav>
  <div class="pie-lateral">
    <p id="servicio" class="servicio"></p>
    <button id="salir" type="button"></button>
  </div>
</aside>
<div class="contenido">
<main id="pantalla-inicio">
  <header class="cabecera">
    <h1 id="titulo-inicio"></h1>
    <p id="ayuda-inicio" class="nota"></p>
  </header>
  <section class="hero" id="estado">
    <div id="semaforo" class="escudo" role="img">
      <svg class="icono-escudo" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield-check"/></svg>
      <svg class="icono-giro" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
    </div>
    <div class="estado-texto">
      <p id="pastilla" class="pastilla"></p>
      <h2 id="nivel"></h2>
      <p id="linea-ultima" class="nota"></p>
      <p id="linea-proxima" class="nota"></p>
      <p id="aviso" class="aviso" hidden></p>
    </div>
    <div class="acciones">
      <button id="verificar" class="secundario" type="button"></button>
      <button id="copiar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-upload"/></svg><span></span></button>
      <button id="cancelar" type="button"></button>
    </div>
    <div id="progreso" hidden>
      <div class="progreso-cabecera">
        <p id="porcentaje" class="porcentaje"></p>
        <p id="queda" class="nota"></p>
      </div>
      <div class="barra"><div id="avance"></div></div>
      <dl class="datos cifras">
        <div><dt id="etiq-ficheros"></dt><dd id="ficheros"></dd></div>
        <div><dt id="etiq-anadidos"></dt><dd id="anadidos"></dd></div>
        <div><dt id="etiq-velocidad"></dt><dd id="velocidad"></dd></div>
        <div><dt id="etiq-transcurrido"></dt><dd id="transcurrido"></dd></div>
      </dl>
      <p id="etiq-actual" class="nota"></p>
      <p id="actual" class="ruta"></p>
    </div>
  </section>
  <p id="aviso-curso" class="aviso-caja info" hidden></p>
  <section class="tres" id="tarjetas">
    <article>
      <h2 id="etiq-destino"></h2>
      <p id="destino-nombre" class="fuerte"></p>
      <p id="destino-estado" class="punto"></p>
      <div class="barra"><div id="barra-disco"></div></div>
      <p id="destino-espacio" class="nota"></p>
    </article>
    <article>
      <h2 id="etiq-seleccion"></h2>
      <p id="seleccion-texto" class="fuerte"></p>
      <p id="seleccion-nombres" class="nota"></p>
      <button id="cambiar-seleccion" class="enlace" type="button"></button>
    </article>
    <article>
      <h2 id="etiq-verificacion"></h2>
      <p id="verificacion" class="fuerte"></p>
      <p id="verificacion-cuando" class="nota"></p>
      <p id="verificacion-estado" class="punto"></p>
      <button id="verificacion-real" class="enlace" type="button" hidden></button>
      <pre id="verificacion-detalle" class="registro" hidden></pre>
    </article>
  </section>
  <section class="tarjeta actividad">
    <div class="fila-titulo">
      <h2 id="etiq-reciente"></h2>
      <button id="ver-historial" class="enlace" type="button"></button>
    </div>
    <div id="recientes" class="lista"></div>
  </section>
</main>
<section id="pantalla-copiar" class="pagina" hidden></section>
<section id="pantalla-destino" class="pagina" hidden></section>
<section id="pantalla-cuando" class="pagina" hidden></section>
<section id="pantalla-retencion" class="pagina" hidden></section>
<section id="pantalla-verificar" class="pagina" hidden></section>
<section id="pantalla-historial" class="pagina" hidden></section>
<section id="pantalla-restaurar" class="pagina" hidden></section>
<section id="pantalla-ajustes" class="pagina" hidden></section>
<section id="pantalla-asistente" class="pagina asistente" hidden></section>
</div>
</div>
<script src="/textos.js?v=volver"></script>
<script src="/config.js?v=volver"></script>
<script src="/destino.js"></script>
<script src="/asistente.js"></script>
<script src="/historial.js"></script>
<script src="/restaurar.js"></script>
<script src="/ajustes.js"></script>
<script src="/app.js"></script>
</body>
</html>
